name: macos label probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: arch
        run: |
          uname -m
          sw_vers -productVersion
          xcodebuild -version