# 鍦?GitHub Actions 鐨?macOS 鏈哄櫒涓婃瀯寤?Wenku8 Flutter 鐨勬湭绛惧悕 iOS 鍖咃紙.ipa锛?# 浜х墿: Wenku8-unsigned.ipa -> 鐢?Sideloadly / AltStore 浠ヨ嚜宸辩殑 Apple ID 绛惧悕鍚庡畨瑁?#
# 鏀剧疆璺緞: .github/workflows/ios-unsigned-ipa.yml
# 瑙﹀彂鏂瑰紡: Actions -> Build unsigned iOS IPA -> Run workflow

name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      strip_app_groups:
        description: "绉婚櫎 App Groups 鏉冮檺锛堝厤璐?Apple ID 鏃犳硶閰嶇疆璇ヨ兘鍔涳紝淇濇寔寮€鍚級"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: 婧愮爜姒傚喌
        run: |
          echo "repo: $GITHUB_REPOSITORY @ $GITHUB_SHA"
          grep -m1 '^version:' pubspec.yaml
          ls ios

      - name: 绉婚櫎 App Groups 鏉冮檺
        if: ${{ inputs.strip_app_groups }}
        run: |
          python3 - <<'PY'
          import pathlib
          empty = (
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" '
              '"http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n'
              '<plist version="1.0"><dict/></plist>\n'
          )
          for p in ("ios/Runner/ReadingWidgets.entitlements",
                    "ios/ReadingWidgets/ReadingWidgets.entitlements"):
              f = pathlib.Path(p)
              if f.exists():
                  f.write_text(empty, encoding="utf-8")
                  print("stripped", p)
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 宸ュ叿閾剧増鏈?        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: 鎷夊彇渚濊禆
        run: flutter pub get

      - name: 瀹夎 Pods
        run: |
          cd ios
          pod install --repo-update

      - name: 鏋勫缓锛堜笉绛惧悕锛?        run: flutter build ios --release --no-codesign

      - name: 鎵撳寘鎴?ipa
        run: |
          set -euo pipefail
          cd build/ios/iphoneos
          rm -rf Payload Wenku8-unsigned.ipa
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry Wenku8-unsigned.ipa Payload
          ls -lh Wenku8-unsigned.ipa
          echo "--- 涓诲簲鐢?Info.plist ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier'        Runner.app/Info.plist || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Runner.app/Info.plist || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion'            Runner.app/Info.plist || true
          echo "--- 鍐呭祵鎵╁睍 ---"
          ls Runner.app/PlugIns || true

      - uses: actions/upload-artifact@v4
        with:
          name: Wenku8-ios-unsigned-ipa
          path: build/ios/iphoneos/Wenku8-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
